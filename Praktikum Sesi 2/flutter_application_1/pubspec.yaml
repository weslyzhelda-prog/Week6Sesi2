name: flutter_application_sayurmayur
description: "Aplikasi Sayur Mayur - Praktikum PAM W6S2S3"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Package tambahan yang digunakan pada modul ini
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.2.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Mendaftarkan seluruh isi folder assets/ (aman walau ada file yang belum ada)
  assets:
    - assets/